<!DOCTYPE html>

    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EigoDaily">
    <title>EigoDaily</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        .highlight-phrase {
            background: #fef08a;
            border-radius: 4px;
            padding: 1px 3px;
            cursor: pointer;
            transition: background 0.15s;
            display: inline;
        }

            width: 36px; height: 36px;
            border: 3px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;

            margin: 0 auto;
        }

        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="app"></div>

<script>
// ===== CONSTANTS =====
const CATEGORIES = [

        emoji: '👤',
        prompt: 'professional self-introduction and job interview English for a Customer Success Manager targeting major Japanese companies like Honda'
    },
    {
        id: 'negotiation',
        label: 'ビジネス交渉',
        emoji: '🤝',
        prompt: 'business negotiation, persuasion, escalation handling, and diplomatic communication in corporate B2B settings'
    },
    {
        id: 'ai',
        label: 'AI時事',
        emoji: '🤖',
        prompt: 'AI adoption in enterprise, SaaS industry trends, DAP (Digital Adoption Platform) technology, and discussing tech topics professionally'
    },
    {
        id: 'daily',
        label: '日常会話',
        emoji: '💬',
        prompt: 'everyday English conversation: talking about hobbies, weekends, food, weather, family, feelings — natural casual English used between friends and acquaintances'
    },
    {
        id: 'travel',
        label: '旅行',
        emoji: '✈️',
        prompt: 'travel English: checking in at airports and hotels, ordering food, asking for directions, sightseeing, dealing with unexpected situations abroad'
    },
    {
        id: 'culture',
        label: '映画・カルチャー',
        emoji: '🎬',
        prompt: 'casual English inspired by movies, TV shows, and pop culture: expressions, slang, and natural conversations that appear in entertainment media'
    },
    {
        id: 'custom',
        label: 'Custom',
        emoji: '✏️',
        prompt: ''
    },
];

// ===== STATE =====
const state = {
    view: localStorage.getItem('apiKey') ? 'home' : 'setup',
    apiKey: localStorage.getItem('apiKey') || '',
    category: 'cs',
    episodes: JSON.parse(localStorage.getItem('episodes') || '{}'),
    currentEpisode: null,
    ttsRate: parseFloat(localStorage.getItem('ttsRate') || '1.0'),
    voiceNameA: localStorage.getItem('voiceNameA') || '',
    voiceNameB: localStorage.getItem('voiceNameB') || '',
    isPlaying: false,
    isPaused: false,
    activePhrase: null,
    showTranslations: false,
    savedPhrases: JSON.parse(localStorage.getItem('savedPhrases') || '[]'),
    customFormat: localStorage.getItem('customFormat') || '',
    customTopic: localStorage.getItem('customTopic') || '',
    categoryOptions: JSON.parse(localStorage.getItem('categoryOptions') || '{}'),
    optionsPanelOpen: false,
};

// ===== TTS ENGINE =====
let ttsSegments = [];
let ttsIndex = 0;

// Preferred voice names in order of quality
const VOICE_PRIORITY = [
    'Google US English', 'Google UK English Female', 'Google UK English Male',
    'Samantha', 'Karen', 'Daniel', 'Moira', 'Fiona', 'Victoria',
    'Google', 'Natural', 'Enhanced', 'Premium',
];

function getEnglishVoices() {
    return speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
}

function getBestVoice(preferFemale = false) {
    const voices = getEnglishVoices();
    if (voices.length === 0) return null;

    // Try priority list first
    for (const pref of VOICE_PRIORITY) {
        const match = voices.find(v => {
            if (!v.name.includes(pref.split(' ')[0])) return false;
            if (preferFemale) {
                return v.name.toLowerCase().includes('female') ||
                    ['Samantha', 'Karen', 'Moira', 'Fiona', 'Victoria',
                     'Google UK English Female'].some(n => v.name.includes(n));
            }
            return true;
        });
        if (match) return match;
    }

    // Fallback: first (male) or second (female attempt) voice
    return preferFemale && voices.length > 1 ? voices[1] : voices[0];
}

function getVoice(speakerId) {
    const voices = getEnglishVoices();
    if (voices.length === 0) return null;

    // C borrows A's voice at a slightly lower pitch via rate tweak (handled in ttsPlayNext)
    const effectiveId = speakerId === 'C' ? 'A' : speakerId;
    const savedName = effectiveId === 'B' ? state.voiceNameB : state.voiceNameA;
    if (savedName) {
        const found = voices.find(v => v.name === savedName);
        if (found) return found;
    }

    return getBestVoice(effectiveId === 'B');
}

function initDefaultVoices() {
    // Auto-select best voices on first run (if not already saved)
    if (!state.voiceNameA) {
        const voiceA = getBestVoice(false);
        if (voiceA) {
            state.voiceNameA = voiceA.name;
            localStorage.setItem('voiceNameA', voiceA.name);
        }
    }
    if (!state.voiceNameB) {
        const voiceB = getBestVoice(true);
        if (voiceB) {
            state.voiceNameB = voiceB.name;
            localStorage.setItem('voiceNameB', voiceB.name);
        }
    }
}

function ttsSpeak(episode) {
    speechSynthesis.cancel();
    ttsSegments = episode.segments;
    ttsIndex = 0;
    ttsPlayNext();
}

function ttsPlayNext() {
    if (ttsIndex >= ttsSegments.length) {
        state.isPlaying = false;
        state.isPaused = false;
        updatePlayerUI();
        return;
    }
    const seg = ttsSegments[ttsIndex];
    const utter = new SpeechSynthesisUtterance(seg.text);
    utter.lang = 'en-US';
    utter.rate = state.ttsRate;

    const voice = getVoice(seg.speaker);
    if (voice) utter.voice = voice;

    utter.onend = () => { ttsIndex++; ttsPlayNext(); };
    utter.onerror = () => { state.isPlaying = false; updatePlayerUI(); };

    speechSynthesis.speak(utter);
}

function updatePlayerUI() {
    const btn = document.getElementById('playBtn');
    if (!btn) return;
    btn.textContent = state.isPlaying ? '⏸ 一時停止' : '▶ 再生';
}

// ===== CLAUDE API =====
async function generateEpisode(categoryId, customTopic = '', customFormat = '', options = {}) {
    const cat = CATEGORIES.find(c => c.id === categoryId);
    let topicPrompt = cat.prompt;
    if (categoryId === 'custom') {
        const parts = [];
        if (customFormat) parts.push(`Format: ${customFormat}`);
        if (customTopic) parts.push(`Topic: ${customTopic}`);
        topicPrompt = parts.join('. ');
    } else {
        if (options.format) topicPrompt += `. Format: ${options.format}`;
        if (options.instructions) topicPrompt += `. Additional requirements: ${options.instructions}`;
    }
    const activeFormat = categoryId === 'custom' ? customFormat : (options.format || '');
    const formatObj = CUSTOM_FORMATS.find(f => f.value === activeFormat);
    const speakerCount = formatObj ? formatObj.speakers : 2;

    const systemPrompt = `You are an English learning content creator for a Japanese business professional.
The learner is: Male, 34, Customer Success Manager at a SaaS company in Tokyo, targeting TOEIC 700-800 and job interviews at major Japanese companies.
Learning style: Podcast-style listening during commute and bath time. 2-3 minutes per episode.
Always return ONLY valid JSON. No markdown fences, no extra text.`;

    const userPrompt = `Create a 2-3 minute Business English learning episode.
Topic: ${topicPrompt}

Return this exact JSON structure:
{
  "title": "Specific, engaging episode title",
  "duration": "2 min",
  "categoryLabel": "${categoryId === 'custom' ? 'Custom' : cat.label}",
  "speakers": ${speakerCount === 1
    ? '[{"id":"A","name":"Name (Role)","gender":"male"}]'
    : speakerCount === 3
    ? '[{"id":"A","name":"Name (Role)","gender":"male"},{"id":"B","name":"Name (Role)","gender":"female"},{"id":"C","name":"Name (Role)","gender":"male"}]'
    : '[{"id":"A","name":"Name (Role)","gender":"male"},{"id":"B","name":"Name (Role)","gender":"female"}]'},
  "segments": [
    {
      "speaker": "A",
      "text": "Natural spoken English. 2-4 sentences per segment.",
      "translation": "textの自然な日本語訳",
      "highlights": [
        {
          "phrase": "exact phrase from the text above (word-for-word match)",
          "explanation": "日本語で意味・ニュアンス・使い方を2〜3文で説明"
        }
      ]
    }
  ]
}

Rules:
- 4-6 segments total, realistic dialogue between two professionals
- 2-3 highlights per segment, choose practical business phrases
- Phrases must be verbatim substrings of the segment text
- Japanese explanations should be practical and include usage notes
- translation must be natural Japanese, not word-for-word`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'x-api-key': state.apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 4096,
            system: systemPrompt,
            messages: [{ role: 'user', content: userPrompt }]
        })
    });

    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `APIエラー (${res.status})`);
    }

    const data = await res.json();
    const raw = data.content[0].text;

    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('レスポンスのパースに失敗しました。もう一度お試しください。');

    let episode;
    try {
        episode = JSON.parse(match[0]);
    } catch (e) {
        throw new Error('JSONのパースに失敗しました。もう一度お試しください。');
    }
    episode.generatedAt = new Date().toISOString();
    return episode;
}

// ===== HELPERS =====
function getAllPhrases(episode) {
    const out = [];
    episode.segments.forEach(seg => {
        (seg.highlights || []).forEach(h => out.push(h));
    });
    return out;
}

function escapeHtml(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function buildHighlightedText(text, highlights, segIndex) {
    if (!highlights || highlights.length === 0) return escapeHtml(text);

    // Sort highlights by position in text (longest first to avoid partial overlaps)
    const sorted = [...highlights]
        .map((h, i) => ({ ...h, idx: i, pos: text.indexOf(h.phrase) }))
        .filter(h => h.pos !== -1)
        .sort((a, b) => a.pos - b.pos);

    let result = '';
    let cursor = 0;

    sorted.forEach(h => {
        if (h.pos < cursor) return; // skip overlapping
        result += escapeHtml(text.slice(cursor, h.pos));
        result += `<span
            class="highlight-phrase"
            data-seg="${segIndex}"
            data-hi="${h.idx}"
            data-phrase="${encodeURIComponent(h.phrase)}"
            data-explanation="${encodeURIComponent(h.explanation)}"
        >${escapeHtml(h.phrase)}</span>`;
        cursor = h.pos + h.phrase.length;
    });

    result += escapeHtml(text.slice(cursor));
    return result;
}

// ===== RENDER =====
function render() {
    const app = document.getElementById('app');
    if (state.view === 'setup')      app.innerHTML = renderSetup();
    if (state.view === 'home')       app.innerHTML = renderHome();
    if (state.view === 'episode')    app.innerHTML = renderEpisode();
    if (state.view === 'phrasebook') app.innerHTML = renderPhrasebook();
    attachListeners();
}

        </div>

      <!-- Header -->
      <div class="bg-white border-b border-gray-100 px-4 pt-12 pb-4 flex items-center justify-between sticky top-0 z-10">
        <div>
          <h1 class="text-xl font-bold text-gray-900">🎧 EigoDaily</h1>
          <p class="text-xs text-gray-400">ビジネス英語、毎日2分</p>
        </div>
        <button id="settingsBtn" class="text-2xl">⚙️</button>
      </div>

      <!-- Category Tabs -->
      <div class="px-4 pt-4">
        <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1">

            🔄 新しいエピソードを生成する
          </button>` : ''}

        <!-- Phrasebook Entry -->
        <button id="phrasebookBtn" class="w-full mt-4 py-3 rounded-xl border border-amber-200 bg-amber-50 text-sm text-amber-700 font-semibold active:bg-amber-100 flex items-center justify-center gap-2">
          ⭐ フレーズ帳
          ${state.savedPhrases.length > 0 ? `<span style="background:#f59e0b;color:white;font-size:11px;padding:1px 7px;border-radius:99px;">${state.savedPhrases.length}</span>` : ''}
        </button>

}

function getCategoryOpts() {
    return state.categoryOptions[state.category] || { format: '', instructions: '' };
}

function saveCategoryOpts(opts) {
    state.categoryOptions[state.category] = opts;
    localStorage.setItem('categoryOptions', JSON.stringify(state.categoryOptions));
}

function renderOptionsPanel() {
    const opts = getCategoryOpts();
    const hasOpts = !!(opts.format || opts.instructions.trim());
    const open = state.optionsPanelOpen;

    return `
    <div class="mt-3 rounded-2xl border overflow-hidden"
         style="border-color:${hasOpts ? '#a78bfa' : '#e5e7eb'};background:${hasOpts ? '#faf5ff' : 'white'};">

      <!-- Toggle row -->
      <button id="optionsToggleBtn" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:none;border:none;cursor:pointer;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:13px;font-weight:600;color:${hasOpts ? '#7c3aed' : '#6b7280'};">🎛 オプション指定</span>
          ${hasOpts ? `<span style="font-size:10px;font-weight:700;background:#7c3aed;color:white;padding:1px 7px;border-radius:99px;">設定中</span>` : `<span style="font-size:11px;color:#9ca3af;">任意</span>`}
        </div>

        <p style="font-size:12px;color:#6b7280;margin:0 0 10px;">形式や含めたいフレーズを指定できます。空欄なら通常生成。</p>

        <!-- Format chips -->
        <p style="font-size:12px;font-weight:600;color:#374151;margin:0 0 6px;">形式（任意）</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
          ${CUSTOM_FORMATS.map((f, i) => {
            const active = opts.format === f.value;
            return `<button class="opt-format-btn" data-index="${i}"
              style="font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid ${active ? '#7c3aed' : '#e5e7eb'};background:${active ? '#7c3aed' : '#f9fafb'};color:${active ? 'white' : '#374151'};cursor:pointer;">

        <!-- Instructions -->
        <p style="font-size:12px;font-weight:600;color:#374151;margin:0 0 6px;">追加指示（任意）</p>
        <textarea id="optInstructionsArea" rows="2"
          placeholder="例：空港での乗り継ぎシーン&#10;例：&quot;take it to the next level&quot; というフレーズを含めて"

        ${hasOpts ? `

          🗑 オプションをクリア

      </div>
    </div>`;
}

const CUSTOM_FORMATS = [

    { label: '複数人の会話', value: 'a group conversation with 3 speakers (A, B, and C) naturally talking together',                     speakers: 3 },
    { label: 'スピーチ',     value: 'a monologue speech delivered by a single speaker (A only) to an audience',                          speakers: 1 },
    { label: 'ポッドキャスト', value: 'a podcast-style narration by a single host (A only) explaining a topic in an engaging way',       speakers: 1 },
    { label: 'インタビュー', value: 'an interview format where A is the interviewer and B is the guest being interviewed',               speakers: 2 },
    { label: 'ニュース解説', value: 'a news broadcast style with anchor A introducing the story and reporter B adding commentary',       speakers: 2 },
];

function renderEpisodeCard(ep) {

    return `

      <div class="px-5 py-4" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);">

        <h2 class="text-white font-bold text-lg mt-1 leading-snug">${escapeHtml(ep.title)}</h2>
        <p class="text-blue-200 text-xs mt-2">⏱ ${ep.duration} &nbsp;•&nbsp; ${isDialog ? '対話形式' : 'モノローグ'}</p>

      <div class="p-5">
        <p class="text-gray-500 text-sm leading-relaxed line-clamp-3">${escapeHtml(ep.segments[0]?.text || '')}</p>
        <button id="openEpisodeBtn" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm active:bg-blue-700 transition-colors">

// --- Episode ---
function renderEpisode() {
    const ep = state.currentEpisode;
    const isDialog = ep.speakers && ep.speakers.length > 1;
    const allPhrases = getAllPhrases(ep);

    return `
    <div class="min-h-screen bg-gray-50">
      <!-- Header -->
      <div class="bg-white border-b border-gray-100 px-4 pt-12 pb-4 flex items-center gap-3 sticky top-0 z-10">
        <button id="backBtn" class="text-blue-600 font-semibold text-sm whitespace-nowrap">← 戻る</button>

          <p class="text-xs text-gray-400 truncate">${escapeHtml(ep.categoryLabel)}</p>
          <h1 class="font-bold text-gray-900 text-sm truncate leading-tight">${escapeHtml(ep.title)}</h1>
        </div>
        <button id="translationToggleBtn"
          style="flex-shrink:0;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;${state.showTranslations ? 'background:#2563eb;color:white;' : 'background:#f3f4f6;color:#374151;'}">

      <!-- Script -->
      <div class="px-4 pt-4 pb-40">
        ${isDialog && ep.speakers ? `
          <div class="flex gap-3 mb-4">

              <div class="flex items-center gap-1.5 text-xs text-gray-500">
                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${i === 0 ? '#3b82f6' : '#22c55e'}"></span>
                ${escapeHtml(s.name)}
              </div>

          </div>` : ''}

        ${ep.segments.map((seg, si) => {
            const speakerIndex = ep.speakers ? ep.speakers.findIndex(s => s.id === seg.speaker) : 0;
            const SPEAKER_COLORS = ['#3b82f6', '#22c55e', '#f59e0b'];
            const borderColor = SPEAKER_COLORS[speakerIndex] || '#3b82f6';
            const highlightedText = buildHighlightedText(seg.text, seg.highlights, si);
            const speaker = ep.speakers ? ep.speakers.find(s => s.id === seg.speaker) : null;

            return `
            <div class="mb-4">
              ${isDialog && speaker ? `<p class="text-xs font-bold text-gray-400 uppercase mb-1.5 pl-4">${escapeHtml(speaker.name)}</p>` : ''}
              <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100"
                   style="${isDialog ? `border-left:4px solid ${borderColor};` : ''}">
                <p class="text-gray-900 text-base leading-relaxed">${highlightedText}</p>
                ${seg.translation ? `
                  <p class="translation-text text-gray-500 text-sm leading-relaxed mt-2 pt-2 border-t border-gray-100"
                     style="display:${state.showTranslations ? 'block' : 'none'}">
                    ${escapeHtml(seg.translation)}
                  </p>` : ''}
              </div>
            </div>`;
        }).join('')}

        <!-- Key Phrases Summary -->
        ${allPhrases.length > 0 ? `
        <div class="mt-6 bg-amber-50 rounded-2xl p-4 border border-amber-100">
          <h3 class="font-bold text-gray-800 text-sm mb-4">📌 今日のキーフレーズ (${allPhrases.length})</h3>
          ${allPhrases.map(p => {
            const isSaved = state.savedPhrases.some(s => s.phrase === p.phrase);
            return `
            <div class="mb-3 last:mb-0 pb-3 last:pb-0 border-b border-amber-100 last:border-0">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                <div style="flex:1;min-width:0;">
                  <p class="font-semibold text-gray-900 text-sm">${escapeHtml(p.phrase)}</p>
                  <p class="text-gray-600 text-xs mt-1 leading-relaxed">${escapeHtml(p.explanation)}</p>
                </div>
                <button class="save-phrase-btn flex-shrink-0 text-lg" data-phrase="${encodeURIComponent(p.phrase)}" data-explanation="${encodeURIComponent(p.explanation)}" data-episode="${encodeURIComponent(ep.title)}"
                  style="background:none;border:none;cursor:pointer;padding:2px;">${isSaved ? '⭐' : '☆'}</button>
              </div>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>

      <!-- Player -->
      <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-4 shadow-2xl">
        <!-- Speed -->
        <div class="flex justify-center gap-2 mb-3">
          ${[0.75, 1.0, 1.25].map(r => `
            <button
              class="speed-btn px-5 py-1.5 rounded-full text-sm font-semibold transition-all"
              data-rate="${r}"
              style="${state.ttsRate === r
                ? 'background:#2563eb;color:white;'
                : 'background:#f3f4f6;color:#374151;'}"
            >${r}x</button>
          `).join('')}
        </div>
        <!-- Controls -->
        <div class="flex items-center gap-3">
          <button id="rewindBtn" class="w-11 h-11 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 text-lg active:bg-gray-200">⏮</button>
          <button id="playBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold text-base active:bg-blue-700 transition-colors">
            ${state.isPlaying ? '⏸ 一時停止' : '▶ 再生'}
          </button>
          <button id="stopBtn" class="w-11 h-11 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 text-lg active:bg-gray-200">⏹</button>

// ===== LOADING STATE =====
function showLoading(container) {
    container.innerHTML = `
    <div class="p-10 text-center">
      <div class="spinner mb-4"></div>
      <p class="text-gray-600 font-medium">AIがスクリプトを生成中...</p>
      <p class="text-gray-400 text-sm mt-1">最大10秒ほどかかります</p>
    </div>`;
}

function showError(container, message) {
    container.innerHTML = `
    <div class="p-8 text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="text-gray-800 font-semibold">生成に失敗しました</p>
      <p class="text-gray-500 text-sm mt-1 mb-4">${escapeHtml(message)}</p>
      <button onclick="render()" class="px-6 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium">
        やり直す
      </button>
    </div>`;
}

// ===== EVENT LISTENERS =====
function attachListeners() {
    // Setup: save API key
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    if (saveKeyBtn) {
        saveKeyBtn.addEventListener('click', () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) { alert('APIキーを入力してください'); return; }
            state.apiKey = key;
            localStorage.setItem('apiKey', key);
            state.view = 'home';
            render();
        });
        document.getElementById('apiKeyInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') saveKeyBtn.click();
        });
    }

    // Settings: show modal
    const settingsBtn = document.getElementById('settingsBtn');
    if (settingsBtn) {
        settingsBtn.addEventListener('click', showSettingsModal);
    }

    // Options panel toggle
    const optionsToggleBtn = document.getElementById('optionsToggleBtn');
    if (optionsToggleBtn) {
        optionsToggleBtn.addEventListener('click', () => {
            state.optionsPanelOpen = !state.optionsPanelOpen;
            const body = document.getElementById('optionsPanelBody');
            const arrow = optionsToggleBtn.querySelector('span:last-child');
            if (body) body.style.display = state.optionsPanelOpen ? 'block' : 'none';
            if (arrow) arrow.textContent = state.optionsPanelOpen ? '▲' : '▼';
        });
    }

    // Options: format chips
    document.querySelectorAll('.opt-format-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const opts = getCategoryOpts();
            const fmt = CUSTOM_FORMATS[parseInt(btn.dataset.index, 10)];
            opts.format = opts.format === fmt.value ? '' : fmt.value;
            saveCategoryOpts(opts);
            document.querySelectorAll('.opt-format-btn').forEach(b => {
                const active = CUSTOM_FORMATS[parseInt(b.dataset.index, 10)].value === opts.format;
                b.style.background = active ? '#7c3aed' : '#f9fafb';
                b.style.color = active ? 'white' : '#374151';
                b.style.borderColor = active ? '#7c3aed' : '#e5e7eb';
            });
            updateOptionsPanelHeader();
        });
    });

    // Options: instructions textarea
    const optInstructionsArea = document.getElementById('optInstructionsArea');
    if (optInstructionsArea) {
        optInstructionsArea.addEventListener('input', () => {
            const opts = getCategoryOpts();
            opts.instructions = optInstructionsArea.value;
            saveCategoryOpts(opts);
            updateOptionsPanelHeader();
        });
    }

    // Options: clear button
    const clearOptsBtn = document.getElementById('clearOptsBtn');
    if (clearOptsBtn) {
        clearOptsBtn.addEventListener('click', () => {
            saveCategoryOpts({ format: '', instructions: '' });
            render();
        });
    }

    // Custom: format chips
    document.querySelectorAll('.custom-format-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const fmt = CUSTOM_FORMATS[parseInt(btn.dataset.index, 10)];
            state.customFormat = state.customFormat === fmt.value ? '' : fmt.value;
            localStorage.setItem('customFormat', state.customFormat);
            document.querySelectorAll('.custom-format-btn').forEach(b => {
                const isActive = CUSTOM_FORMATS[parseInt(b.dataset.index, 10)].value === state.customFormat;
                b.style.background = isActive ? '#7c3aed' : '#f9fafb';
                b.style.color = isActive ? 'white' : '#374151';
                b.style.borderColor = isActive ? '#7c3aed' : '#e5e7eb';
            });
            updateCustomGenerateBtn();
        });
    });

    // Custom: topic free text
    const customTopicArea = document.getElementById('customTopicArea');
    if (customTopicArea) {
        customTopicArea.addEventListener('input', () => {
            state.customTopic = customTopicArea.value;
            localStorage.setItem('customTopic', state.customTopic);
            updateCustomGenerateBtn();
        });
    }

    // Custom: generate button
    const customGenerateBtn = document.getElementById('customGenerateBtn');
    if (customGenerateBtn) {
        customGenerateBtn.addEventListener('click', async () => {
            if (!state.customFormat && !state.customTopic.trim()) return;
            const card = document.getElementById('customFormCard');
            if (card) showLoading(card);
            try {
                const ep = await generateEpisode('custom', state.customTopic.trim(), state.customFormat);
                state.episodes['custom'] = ep;
                localStorage.setItem('episodes', JSON.stringify(state.episodes));
                state.currentEpisode = ep;
                state.view = 'episode';
                render();
            } catch (err) {
                if (card) showError(card, err.message);
            }
        });
    }

    // Phrasebook button (home)
    const phrasebookBtn = document.getElementById('phrasebookBtn');
    if (phrasebookBtn) {
        phrasebookBtn.addEventListener('click', () => {
            state.view = 'phrasebook';
            render();
        });
    }

    // Translation toggle (episode)
    const translationToggleBtn = document.getElementById('translationToggleBtn');
    if (translationToggleBtn) {
        translationToggleBtn.addEventListener('click', () => {
            state.showTranslations = !state.showTranslations;
            // Toggle all translation texts without full re-render
            document.querySelectorAll('.translation-text').forEach(el => {
                el.style.display = state.showTranslations ? 'block' : 'none';
            });
            translationToggleBtn.style.background = state.showTranslations ? '#2563eb' : '#f3f4f6';
            translationToggleBtn.style.color = state.showTranslations ? 'white' : '#374151';
        });
    }

    // Save phrase buttons (episode key phrases)
    document.querySelectorAll('.save-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const phrase = decodeURIComponent(btn.dataset.phrase);
            const explanation = decodeURIComponent(btn.dataset.explanation);
            const episodeTitle = decodeURIComponent(btn.dataset.episode);

            const alreadySaved = state.savedPhrases.findIndex(s => s.phrase === phrase);
            if (alreadySaved !== -1) {
                state.savedPhrases.splice(alreadySaved, 1);
                btn.textContent = '☆';
            } else {
                state.savedPhrases.unshift({ phrase, explanation, episodeTitle, savedAt: new Date().toISOString() });
                btn.textContent = '⭐';
            }
            localStorage.setItem('savedPhrases', JSON.stringify(state.savedPhrases));
        });
    });

    // Delete single phrase (phrasebook)
    document.querySelectorAll('.delete-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const i = parseInt(btn.dataset.index, 10);
            state.savedPhrases.splice(i, 1);
            localStorage.setItem('savedPhrases', JSON.stringify(state.savedPhrases));
            render();
        });
    });

    // Clear all phrases (phrasebook)
    const clearPhrasesBtn = document.getElementById('clearPhrasesBtn');
    if (clearPhrasesBtn) {
        clearPhrasesBtn.addEventListener('click', () => {
            if (confirm('保存したフレーズをすべて削除しますか？')) {
                state.savedPhrases = [];
                localStorage.setItem('savedPhrases', '[]');
                render();
            }
        });
    }

    // Category tabs
    document.querySelectorAll('.category-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            state.category = btn.dataset.category;
            render();
        });
    });

    // Generate
    const generateBtn = document.getElementById('generateBtn');
    if (generateBtn) {
        generateBtn.addEventListener('click', async () => {
            const card = document.getElementById('generateCard');
            showLoading(card);
            try {
                const ep = await generateEpisode(state.category, '', '', getCategoryOpts());
                state.episodes[state.category] = ep;
                localStorage.setItem('episodes', JSON.stringify(state.episodes));
                state.currentEpisode = ep;
                state.view = 'episode';
                render();
            } catch (err) {
                showError(card, err.message);
            }
        });
    }

    // Regenerate
    const regenerateBtn = document.getElementById('regenerateBtn');
    if (regenerateBtn) {
        regenerateBtn.addEventListener('click', async () => {
            const btn = regenerateBtn;
            btn.disabled = true;
            btn.textContent = '生成中...';

            // Replace card area with loading
            const card = document.querySelector('.bg-white.rounded-2xl.shadow-sm');
            if (card) showLoading(card);

            try {
                const ep = await generateEpisode(state.category, '', '', getCategoryOpts());
                state.episodes[state.category] = ep;
                localStorage.setItem('episodes', JSON.stringify(state.episodes));
                state.currentEpisode = ep;
                state.view = 'episode';
                render();
            } catch (err) {
                render(); // restore
                alert('生成失敗: ' + err.message);
            }
        });
    }

    // Open episode
    const openEpisodeBtn = document.getElementById('openEpisodeBtn');
    if (openEpisodeBtn) {
        openEpisodeBtn.addEventListener('click', () => {
            state.currentEpisode = state.episodes[state.category];
            state.view = 'episode';
            render();
        });
    }

    // Back
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
        backBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            state.isPlaying = false;
            state.isPaused = false;
            state.view = 'home';
            render();
        });
    }

    // Speed buttons
    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.ttsRate = parseFloat(btn.dataset.rate);
            localStorage.setItem('ttsRate', String(state.ttsRate));
            if (state.isPlaying) {
                speechSynthesis.cancel();
                ttsSpeak(state.currentEpisode);
            }
            // Update button styles
            document.querySelectorAll('.speed-btn').forEach(b => {
                const active = parseFloat(b.dataset.rate) === state.ttsRate;
                b.style.background = active ? '#2563eb' : '#f3f4f6';
                b.style.color = active ? 'white' : '#374151';
            });
        });
    });

    // Play / Pause
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
        playBtn.addEventListener('click', () => {
            if (state.isPlaying) {
                speechSynthesis.pause();
                state.isPlaying = false;
                state.isPaused = true;
                playBtn.textContent = '▶ 再生';
            } else if (state.isPaused) {
                speechSynthesis.resume();
                state.isPlaying = true;
                state.isPaused = false;
                playBtn.textContent = '⏸ 一時停止';
            } else {
                ttsSpeak(state.currentEpisode);
                state.isPlaying = true;
                state.isPaused = false;
                playBtn.textContent = '⏸ 一時停止';
            }
        });
    }

    // Stop
    const stopBtn = document.getElementById('stopBtn');
    if (stopBtn) {
        stopBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            state.isPlaying = false;
            state.isPaused = false;
            ttsIndex = 0;
            const btn = document.getElementById('playBtn');
            if (btn) btn.textContent = '▶ 再生';
        });
    }

    // Rewind
    const rewindBtn = document.getElementById('rewindBtn');
    if (rewindBtn) {
        rewindBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            ttsIndex = 0;
            if (state.isPlaying) {
                ttsSpeak(state.currentEpisode);
            }
        });
    }

    // Phrase highlights
    document.querySelectorAll('.highlight-phrase').forEach(el => {
        el.addEventListener('click', e => {
            e.stopPropagation();
            const phraseId = `${el.dataset.seg}-${el.dataset.hi}`;

            // Remove all existing tooltips
            document.querySelectorAll('.phrase-tooltip').forEach(t => t.remove());
            document.querySelectorAll('.highlight-phrase.active').forEach(h => h.classList.remove('active'));

            if (state.activePhrase === phraseId) {
                state.activePhrase = null;
                return;
            }

            state.activePhrase = phraseId;
            el.classList.add('active');

            const phrase = decodeURIComponent(el.dataset.phrase);
            const explanation = decodeURIComponent(el.dataset.explanation);

            const tooltip = document.createElement('div');
            tooltip.className = 'phrase-tooltip fade-in';
            tooltip.innerHTML = `<strong style="color:#fde68a">${escapeHtml(phrase)}</strong><br><span style="color:#e2e8f0;font-size:12px">${escapeHtml(explanation)}</span>`;

            // Insert after the parent card div
            const card = el.closest('.bg-white');
            if (card) card.appendChild(tooltip);
        });
    });

    // Click outside to close tooltip
    document.addEventListener('click', e => {
        if (!e.target.classList.contains('highlight-phrase')) {
            document.querySelectorAll('.phrase-tooltip').forEach(t => t.remove());
            document.querySelectorAll('.highlight-phrase.active').forEach(h => h.classList.remove('active'));
            state.activePhrase = null;
        }
    }, { passive: true });
}

function updateOptionsPanelHeader() {
    const opts = getCategoryOpts();
    const hasOpts = !!(opts.format || opts.instructions.trim());
    const panel = document.getElementById('optionsToggleBtn');
    if (!panel) return;
    const label = panel.querySelector('span:first-child');
    if (label) label.style.color = hasOpts ? '#7c3aed' : '#6b7280';
    // Update/remove badge
    const badge = panel.querySelector('span.badge-opts');
    if (hasOpts && !badge) {
        const b = document.createElement('span');
        b.className = 'badge-opts';
        b.style.cssText = 'font-size:10px;font-weight:700;background:#7c3aed;color:white;padding:1px 7px;border-radius:99px;';
        b.textContent = '設定中';
        panel.querySelector('div').appendChild(b);
    } else if (!hasOpts && badge) {
        badge.remove();
    }
}

function updateCustomGenerateBtn() {
    const btn = document.getElementById('customGenerateBtn');
    if (!btn) return;
    const can = !!(state.customFormat || state.customTopic.trim());
    btn.disabled = !can;
    btn.style.background = can ? '#7c3aed' : '#d1d5db';
}

// ===== SETTINGS MODAL =====
const PREVIEW_TEXT = "Hello! I'm your English learning assistant. Let's practice some business English together.";

function previewVoice(selectId, btnId) {
    const selectEl = document.getElementById(selectId);
    const btn = document.getElementById(btnId);
    if (!selectEl) return;

    const voices = getEnglishVoices();
    const voice = voices.find(v => v.name === selectEl.value);

    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(PREVIEW_TEXT);
    utter.lang = 'en-US';
    utter.rate = state.ttsRate;
    if (voice) utter.voice = voice;

    if (btn) {
        btn.textContent = '⏹';
        btn.style.background = '#ef4444';
        utter.onend = utter.onerror = () => {
            btn.textContent = '▶ 試聴';
            btn.style.background = '#2563eb';
        };
    }

    speechSynthesis.speak(utter);
}

function showSettingsModal() {
    const voices = getEnglishVoices();

    const overlay = document.createElement('div');
    overlay.id = 'settingsModal';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;';

    const voiceOptions = (selectedName) => voices.map(v =>
        `<option value="${escapeHtml(v.name)}" ${selectedName === v.name ? 'selected' : ''}>${escapeHtml(v.name)}</option>`
    ).join('');

    const voiceRow = (label, badge, selectId, previewBtnId, selectedName) => `
      <div style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:13px;font-weight:600;color:#374151;">${label}</span>
          <span style="font-size:11px;font-weight:500;color:white;background:${badge === 'A' ? '#3b82f6' : '#22c55e'};padding:1px 8px;border-radius:99px;">${badge}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="${selectId}"
            style="flex:1;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:13px;background:white;outline:none;min-width:0;">
            ${voices.length > 0 ? voiceOptions(selectedName) : '<option>（英語音声なし）</option>'}
          </select>
          <button id="${previewBtnId}"
            style="flex-shrink:0;background:#2563eb;color:white;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">
            ▶ 試聴
          </button>
        </div>
      </div>`;

    overlay.innerHTML = `
    <div style="background:white;border-radius:20px 20px 0 0;width:100%;padding:24px 20px 40px;max-height:88vh;overflow-y:auto;box-sizing:border-box;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">
        <h2 style="font-size:17px;font-weight:700;color:#111827;margin:0;">⚙️ 設定</h2>
        <button id="closeSettingsBtn" style="background:none;border:none;font-size:22px;color:#9ca3af;cursor:pointer;padding:0;line-height:1;">×</button>
      </div>

      <!-- API Key -->
      <div style="margin-bottom:22px;">
        <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Anthropic API Key</label>
        <input id="settingsApiKey" type="password" value="${escapeHtml(state.apiKey)}"
          style="width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:14px;box-sizing:border-box;outline:none;">
      </div>

      <!-- Divider -->
      <div style="border-top:1px solid #f3f4f6;margin-bottom:20px;"></div>
      <p style="font-size:12px;color:#9ca3af;margin:0 0 16px;">音声を選んで「▶ 試聴」で確認できます</p>

      <!-- Voice A -->
      ${voiceRow('Speaker A', 'A', 'voiceSelectA', 'previewBtnA', state.voiceNameA)}

      <!-- Voice B -->
      ${voiceRow('Speaker B', 'B', 'voiceSelectB', 'previewBtnB', state.voiceNameB)}

      ${voices.length === 0 ? `
      <div style="font-size:12px;color:#dc2626;background:#fef2f2;padding:12px;border-radius:10px;margin-bottom:16px;line-height:1.6;">
        ⚠️ 英語音声が見つかりません。<br>
        iPhone: 設定 → アクセシビリティ → 読み上げコンテンツ → 声 → English<br>
        Android: 設定 → ユーザー補助 → テキスト読み上げ → 言語を追加
      </div>` : ''}

      <button id="saveSettingsBtn"
        style="width:100%;background:#2563eb;color:white;padding:14px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;">
        保存する
      </button>
    </div>`;

    document.body.appendChild(overlay);

    // Preview buttons
    document.getElementById('previewBtnA').addEventListener('click', () => previewVoice('voiceSelectA', 'previewBtnA'));
    document.getElementById('previewBtnB').addEventListener('click', () => previewVoice('voiceSelectB', 'previewBtnB'));

    // Save
    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
        speechSynthesis.cancel();
        const newKey = document.getElementById('settingsApiKey').value.trim();
        if (newKey) {
            state.apiKey = newKey;
            localStorage.setItem('apiKey', newKey);
        }
        state.voiceNameA = document.getElementById('voiceSelectA').value;
        state.voiceNameB = document.getElementById('voiceSelectB').value;
        localStorage.setItem('voiceNameA', state.voiceNameA);
        localStorage.setItem('voiceNameB', state.voiceNameB);
        overlay.remove();
    });

    // Close
    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
        speechSynthesis.cancel();
        overlay.remove();
    });
    overlay.addEventListener('click', e => {
        if (e.target === overlay) { speechSynthesis.cancel(); overlay.remove(); }
    });
}

// ===== INIT =====
// Load voices asynchronously
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initDefaultVoices;
}

// Service Worker registration
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Try initializing voices immediately (Chrome loads them sync sometimes)
initDefaultVoices();

render();
</script>
</body>
</html>
