<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EigoDaily">
    <title>English App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --nav-h: 64px;
        }
        * { box-sizing: border-box; }
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            overscroll-behavior: none;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--nav-h); background: white;
            border-top: 1px solid #e5e7eb; display: flex;
            z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-btn {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            padding: 8px 4px; gap: 3px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .nav-icon { font-size: 22px; line-height: 1; }
        .nav-label { font-size: 10px; font-weight: 600; }
        .progress-bar-track { height: 3px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.3s ease; }
        .highlight-phrase {
            background: #fef9c3; border-radius: 4px; padding: 1px 3px;
            cursor: pointer; transition: background 0.15s; display: inline;
            border-bottom: 1.5px solid #fbbf24;
        }
        .highlight-phrase.active { background: #fde68a; }
        .phrase-tooltip {
            background: #1e293b; color: white;
            padding: 10px 12px; border-radius: 10px;
            font-size: 13px; line-height: 1.6; margin-top: 8px;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn 0.2s ease; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #e0e7ff; border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .seg-card {
            background: white; border-radius: 14px; padding: 16px;
            border: 1px solid #e5e7eb; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }
        .seg-card.playing { border-color: var(--primary); box-shadow: 0 0 0 2px #e0e7ff; }
        .speed-pill {
            padding: 6px 18px; border-radius: 99px; font-size: 13px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-primary {
            background: var(--primary); color: white; border-radius: 14px;
            border: none; cursor: pointer; font-weight: 700;
        }
        .btn-primary:active { background: var(--primary-dark); }
        .card { background: white; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .scene-card {
            background: white; border-radius: 14px; padding: 14px 16px;
            border: 1px solid #e5e7eb; margin-bottom: 10px;
        }
        .level-btn {
            flex: 1; padding: 7px 4px; border-radius: 10px; border: 1.5px solid;
            font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
            transition: all 0.15s;
        }
        .level-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

const LEVELS = [
    { id: 'basic',        label: '初級', emoji: '🟢', toeic: '〜550',   color: '#10b981', bg: '#ecfdf5', border: '#6ee7b7' },

    { id: 'advanced',     label: '上級', emoji: '🔴', toeic: '730〜',   color: '#ef4444', bg: '#fef2f2', border: '#fca5a5' },
];

const LEVEL_PROMPTS = {
    basic:        'Difficulty: BEGINNER. Use only common everyday vocabulary (1000-2000 word range), short simple sentences (under 15 words each), slow and clear pronunciation pace, and basic grammar structures. CEFR A2-B1.',
    intermediate: 'Difficulty: INTERMEDIATE. Use professional and business vocabulary, varied sentence structures including relative clauses and conditionals, natural conversational pace, and some idiomatic expressions. CEFR B1-B2.',
    advanced:     'Difficulty: ADVANCED. Use sophisticated vocabulary, idiomatic expressions, complex grammar, fast natural native-speaker pace, cultural references, humor, and nuanced meaning. CEFR B2-C1.',
};

const CUSTOM_FORMATS = [
    { label: '2人の対話',      value: 'a realistic back-and-forth dialogue between exactly 2 speakers (A and B)',                     speakers: 2 },
    { label: '複数人の会話',   value: 'a group conversation with 3 speakers (A, B, and C) naturally talking together',               speakers: 3 },
    { label: 'スピーチ',       value: 'a monologue speech delivered by a single speaker (A only) to an audience',                    speakers: 1 },
    { label: 'ポッドキャスト', value: 'a podcast-style narration by a single host (A only) explaining a topic engagingly',          speakers: 1 },
    { label: 'インタビュー',   value: 'an interview where A is the interviewer and B is the guest being interviewed',               speakers: 2 },
    { label: 'ニュース解説',   value: 'a news broadcast with anchor A introducing and reporter B adding commentary',                speakers: 2 },
];

const SPEAKER_COLORS   = ['#4f46e5', '#10b981', '#f59e0b'];
const SPEAKER_SETTINGS = {
    'A': { pitch: 1.0,  rateMult: 1.0  },
    'B': { pitch: 1.22, rateMult: 1.03 },
    'C': { pitch: 0.76, rateMult: 0.96 },
};

// ===== STATE =====
const state = {
    view:           localStorage.getItem('apiKey') ? 'main' : 'setup',
    bottomTab:      'today',
    apiKey:         localStorage.getItem('apiKey') || '',
    // Learn navigation
    selectedDomain: localStorage.getItem('selectedDomain') || 'business',
    selectedScene:  null,  // { domainId, sceneId }
    selectedLevel:  'intermediate',
    selectedFormat: '',
    showFormatPanel: false,
    showAddSceneForm: false,
    addSceneFormDomain: null,
    // Data
    episodes:       JSON.parse(localStorage.getItem('episodes') || '{}'),
    sceneProgress:  JSON.parse(localStorage.getItem('sceneProgress') || '{}'),
    userScenes:     JSON.parse(localStorage.getItem('userScenes') || '{}'),
    savedPhrases:   JSON.parse(localStorage.getItem('savedPhrases') || '[]'),
    // Playback
    ttsRate:        parseFloat(localStorage.getItem('ttsRate') || '1.0'),
    voiceNameA:     localStorage.getItem('voiceNameA') || '',
    voiceNameB:     localStorage.getItem('voiceNameB') || '',
    isPlaying:      false,
    isPaused:       false,
    currentEpisode: null,
    // UI
    activePhrase:      null,
    showTranslations:  false,
};

// ===== TTS ENGINE =====
let ttsSegments = [], ttsIndex = 0, ttsPauseTimer = null;

const VOICE_PRIORITY = [
    'Google US English','Google UK English Female','Google UK English Male',
    'Samantha','Karen','Daniel','Moira','Fiona','Victoria',
    'Google','Natural','Enhanced','Premium',
];

function getEnglishVoices() { return speechSynthesis.getVoices().filter(v => v.lang.startsWith('en')); }

function getBestVoice(preferFemale = false) {
    const voices = getEnglishVoices();
    if (!voices.length) return null;
    for (const pref of VOICE_PRIORITY) {
        const m = voices.find(v => {
            if (!v.name.includes(pref.split(' ')[0])) return false;
            if (preferFemale)
                return v.name.toLowerCase().includes('female') ||
                    ['Samantha','Karen','Moira','Fiona','Victoria','Google UK English Female'].some(n => v.name.includes(n));
            return true;
        });
        if (m) return m;
    }
    return preferFemale && voices.length > 1 ? voices[1] : voices[0];
}

function getVoice(speakerId) {
    const voices = getEnglishVoices();
    if (!voices.length) return null;
    const eid = speakerId === 'C' ? 'A' : speakerId;
    const saved = eid === 'B' ? state.voiceNameB : state.voiceNameA;
    if (saved) { const f = voices.find(v => v.name === saved); if (f) return f; }
    return getBestVoice(eid === 'B');
}

function initDefaultVoices() {
    if (!state.voiceNameA) { const v = getBestVoice(false); if (v) { state.voiceNameA = v.name; localStorage.setItem('voiceNameA', v.name); } }
    if (!state.voiceNameB) { const v = getBestVoice(true);  if (v) { state.voiceNameB = v.name; localStorage.setItem('voiceNameB', v.name); } }
}

function ttsSpeak(episode) {
    clearTimeout(ttsPauseTimer);
    speechSynthesis.cancel();
    ttsSegments = episode.segments;
    ttsIndex = 0; state.isPlaying = true; state.isPaused = false;
    ttsPlayNext();
}

function ttsPlayNext() {
    updateProgressBar();
    if (ttsIndex >= ttsSegments.length) {
        state.isPlaying = false; state.isPaused = false;
        updatePlayerUI(); updateProgressBar(); return;
    }
    const seg = ttsSegments[ttsIndex];
    const settings = SPEAKER_SETTINGS[seg.speaker] || SPEAKER_SETTINGS['A'];
    const utter = new SpeechSynthesisUtterance(seg.text);
    utter.lang = 'en-US';
    utter.rate  = state.ttsRate * settings.rateMult;
    utter.pitch = settings.pitch;
    const voice = getVoice(seg.speaker);
    if (voice) utter.voice = voice;
    highlightSegment(ttsIndex);
    utter.onend = () => {
        const next = ttsSegments[ttsIndex + 1];
        const changed = next && next.speaker !== seg.speaker;
        ttsIndex++;
        ttsPauseTimer = setTimeout(() => { if (state.isPlaying) ttsPlayNext(); }, changed ? 750 : 380);
    };
    utter.onerror = () => { state.isPlaying = false; updatePlayerUI(); };
    speechSynthesis.speak(utter);
}

function highlightSegment(idx) {
    document.querySelectorAll('.seg-card').forEach((el, i) => el.classList.toggle('playing', i === idx));
}
function updateProgressBar() {
    const fill = document.getElementById('progressFill');
    if (fill) fill.style.width = (ttsSegments.length > 0 ? (ttsIndex / ttsSegments.length) * 100 : 0) + '%';
}
function updatePlayerUI() {
    const btn = document.getElementById('playBtn');
    if (btn) btn.innerHTML = state.isPlaying ? '⏸' : '▶';
    const lbl = document.getElementById('playBtnLabel');
    if (lbl) lbl.textContent = state.isPlaying ? '一時停止' : '再生';
}

// ===== HELPERS =====
function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getAllPhrases(ep) {
    const out = [];
    ep.segments.forEach(seg => (seg.highlights||[]).forEach(h => out.push(h)));
    return out;
}
function buildHighlightedText(text, highlights, segIndex) {
    if (!highlights?.length) return escapeHtml(text);
    const sorted = [...highlights]
        .map((h,i) => ({...h, idx:i, pos:text.indexOf(h.phrase)}))
        .filter(h => h.pos !== -1).sort((a,b) => a.pos - b.pos);
    let result = '', cursor = 0;
    sorted.forEach(h => {
        if (h.pos < cursor) return;
        result += escapeHtml(text.slice(cursor, h.pos));
        result += `<span class="highlight-phrase" data-seg="${segIndex}" data-hi="${h.idx}" data-phrase="${encodeURIComponent(h.phrase)}" data-explanation="${encodeURIComponent(h.explanation)}">${escapeHtml(h.phrase)}</span>`;
        cursor = h.pos + h.phrase.length;
    });
    return result + escapeHtml(text.slice(cursor));
}

function getDomain(domainId)  { return DOMAINS.find(d => d.id === domainId); }
function getAllScenes(domainId) {
    const d = getDomain(domainId);
    if (!d) return [];
    return [...d.scenes, ...(state.userScenes[domainId] || [])];
}
function getScene(domainId, sceneId) { return getAllScenes(domainId).find(s => s.id === sceneId); }
function episodeKey(domainId, sceneId, levelId) { return `${domainId}_${sceneId}_${levelId}`; }
function progressKey(domainId, sceneId, levelId) { return `${domainId}_${sceneId}_${levelId}`; }

function isLevelUnlocked(domainId, sceneId, levelId) {
    if (levelId !== 'advanced') return true;
    return !!(state.sceneProgress[progressKey(domainId, sceneId, 'intermediate')]);
}

function getRecommended(domainId) {
    const scenes = getAllScenes(domainId);
    for (const s of scenes) {
        if (!state.sceneProgress[progressKey(domainId, s.id, 'intermediate')])
            return { sceneId: s.id, levelId: 'intermediate' };
    }
    for (const s of scenes) {
        if (isLevelUnlocked(domainId, s.id, 'advanced') &&
            !state.sceneProgress[progressKey(domainId, s.id, 'advanced')])
            return { sceneId: s.id, levelId: 'advanced' };
    }
    return null;
}

function getTotalProgress() {
    const attempted = new Set(Object.keys(state.sceneProgress)).size;
    const total = DOMAINS.reduce((n, d) => n + d.scenes.length + (state.userScenes[d.id]||[]).length, 0);
    return { attempted, total };
}

function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()}`;
}

function getLastEpisode() {
    const keys = Object.keys(state.episodes);
    if (!keys.length) return null;
    return keys.reduce((best, k) => {
        const ep = state.episodes[k];
        if (!best) return ep;
        return new Date(ep.generatedAt) > new Date(best.generatedAt) ? ep : best;
    }, null);
}

// ===== CLAUDE API =====
async function generateEpisode({ domainId, sceneId, levelId, format = '' }) {
    const scene = getScene(domainId, sceneId);
    const level = LEVELS.find(l => l.id === levelId);
    const levelPrompt = LEVEL_PROMPTS[levelId];
    const domain = getDomain(domainId);

    const formatObj = CUSTOM_FORMATS.find(f => f.value === format);
    const speakerCount = formatObj ? formatObj.speakers : 2;

    let topicPrompt = scene.prompt;
    if (format) topicPrompt += `. Conversation format: ${format}`;
    if (domainId === 'toeic') topicPrompt += '. Model this closely after actual TOEIC Part 3 or Part 4 style conversations.';

    const speakersJson = speakerCount === 1
        ? '[{"id":"A","name":"Name (Role)","gender":"male"}]'
        : speakerCount === 3
        ? '[{"id":"A","name":"Name","gender":"male"},{"id":"B","name":"Name","gender":"female"},{"id":"C","name":"Name","gender":"male"}]'
        : '[{"id":"A","name":"Name","gender":"male"},{"id":"B","name":"Name","gender":"female"}]';

    const systemPrompt = `You are an English learning content creator for a Japanese business professional.
Learner profile: Male, 34, Customer Success Manager at a Tokyo SaaS company. TOEIC 700-800 target, job-change goal to Honda. Learns via podcast listening during commute and bath.
Always return ONLY valid JSON. No markdown fences, no extra text.`;

    const userPrompt = `Create a 2-3 minute English learning episode.
Topic/Scene: ${topicPrompt}
${levelPrompt}

Return this exact JSON:
{
  "title": "Specific engaging title",
  "duration": "2 min",
  "domainLabel": "${domain.label}",
  "sceneLabel": "${scene.label}",
  "levelLabel": "${level.label}",
  "speakers": ${speakersJson},
  "segments": [
    {
      "speaker": "A",
      "text": "Natural spoken English matching the difficulty level. 2-4 sentences.",
      "translation": "自然な日本語訳",
      "highlights": [
        {
          "phrase": "exact verbatim phrase from the text",
          "explanation": "日本語で意味・ニュアンス・使い方を2〜3文で"
        }
      ]
    }
  ]
}
Rules:
- 4-6 segments, 2-3 highlights per segment
- Phrases must be verbatim substrings of the segment text
- Japanese explanations: practical, include usage notes
- Translation: natural Japanese, not word-for-word`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'x-api-key': state.apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
            model: 'claude-sonnet-4-6', max_tokens: 4096,
            system: systemPrompt,
            messages: [{ role: 'user', content: userPrompt }]
        })
    });

    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `APIエラー (${res.status})`);
    }
    const data = await res.json();
    const raw = data.content[0].text;
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('レスポンスのパースに失敗しました');
    let ep;
    try { ep = JSON.parse(match[0]); } catch (e) { throw new Error('JSONのパースに失敗しました'); }
    ep.generatedAt = new Date().toISOString();
    ep.domainId = domainId; ep.sceneId = sceneId; ep.levelId = levelId;
    return ep;
}

}

      <button onclick="state.view='scene';render();" style="padding:10px 24px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;">やり直す</button>
    </div>`;
}

// ===== VOICE PREVIEW =====
const PREVIEW_TEXT = "Hello! I'm your English learning assistant. Let's practice some business English together.";
function previewVoice(selectId, btnId) {
    const sel = document.getElementById(selectId);
    const btn = document.getElementById(btnId);
    if (!sel) return;
    const voice = getEnglishVoices().find(v => v.name === sel.value);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(PREVIEW_TEXT);
    u.lang = 'en-US'; u.rate = state.ttsRate;
    if (voice) u.voice = voice;
    if (btn) {
        btn.textContent = '⏹';
        btn.style.background = '#ef4444';
        u.onend = u.onerror = () => { btn.textContent = '▶ 試聴'; btn.style.background = 'var(--primary)'; };
    }
    speechSynthesis.speak(u);
}

// ===== GENERATE HELPER =====
async function doGenerate(container) {
    const { domainId, sceneId } = state.selectedScene;
    showLoading(container);
    try {
        const ep = await generateEpisode({ domainId, sceneId, levelId: state.selectedLevel, format: state.selectedFormat });
        const key = episodeKey(domainId, sceneId, state.selectedLevel);
        state.episodes[key] = ep;
        localStorage.setItem('episodes', JSON.stringify(state.episodes));
        // Record progress
        const pk = progressKey(domainId, sceneId, state.selectedLevel);
        if (!state.sceneProgress[pk]) state.sceneProgress[pk] = { attempts: 0, firstAt: new Date().toISOString() };
        state.sceneProgress[pk].attempts++;
        state.sceneProgress[pk].lastAt = new Date().toISOString();
        localStorage.setItem('sceneProgress', JSON.stringify(state.sceneProgress));
        // Navigate to episode
        state.currentEpisode = ep;
        state.view = 'episode';
        render();
    } catch (err) {
        showError(container, err.message);
    }
}

// ===== EVENT LISTENERS =====
function attachListeners() {
    // Setup
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    if (saveKeyBtn) {
        saveKeyBtn.addEventListener('click', () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) { alert('APIキーを入力してください'); return; }
            state.apiKey = key; localStorage.setItem('apiKey', key);
            state.view = 'main'; render();
        });
        document.getElementById('apiKeyInput')?.addEventListener('keydown', e => { if (e.key==='Enter') saveKeyBtn.click(); });
    }

    // Bottom nav
    document.querySelectorAll('.bottom-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.bottomTab = btn.dataset.tab; render(); });
    });

    // Today: continue
    document.getElementById('continueEpisodeBtn')?.addEventListener('click', () => {
        const ep = getLastEpisode();
        if (ep) { state.currentEpisode = ep; state.view = 'episode'; render(); }
    });

    // Today: go learn
    document.getElementById('goLearnBtn')?.addEventListener('click', () => { state.bottomTab = 'learn'; render(); });

    // Today: domain cards
    document.querySelectorAll('.today-domain-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.selectedDomain = btn.dataset.domain;
            localStorage.setItem('selectedDomain', state.selectedDomain);
            state.bottomTab = 'learn'; render();
        });
    });

    // Learn: domain tabs
    document.querySelectorAll('.domain-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            state.selectedDomain = btn.dataset.domain;
            localStorage.setItem('selectedDomain', state.selectedDomain);
            render();
        });
    });

    // Learn: scene+level buttons
    document.querySelectorAll('.scene-level-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.selectedScene = { domainId: btn.dataset.domain, sceneId: btn.dataset.scene };
            state.selectedLevel = btn.dataset.level;
            state.showFormatPanel = false;
            state.selectedFormat = '';
            state.view = 'scene'; render();
        });
    });

    // Learn: show add scene form
    document.getElementById('showAddSceneBtn')?.addEventListener('click', e => {
        state.showAddSceneForm = true;
        state.addSceneFormDomain = e.currentTarget.dataset.domain;
        render();
    });
    document.getElementById('cancelAddSceneBtn')?.addEventListener('click', () => {
        state.showAddSceneForm = false; state.addSceneFormDomain = null; render();
    });
    document.getElementById('saveAddSceneBtn')?.addEventListener('click', () => {
        const label  = document.getElementById('newSceneLabel')?.value.trim();
        const prompt = document.getElementById('newScenePrompt')?.value.trim();
        if (!label) { alert('シーン名を入力してください'); return; }
        const domainId = state.addSceneFormDomain || state.selectedDomain;
        if (!state.userScenes[domainId]) state.userScenes[domainId] = [];
        state.userScenes[domainId].push({ id: `u_${Date.now()}`, label, prompt: prompt || label });
        localStorage.setItem('userScenes', JSON.stringify(state.userScenes));
        state.showAddSceneForm = false; state.addSceneFormDomain = null; render();
    });

    // Learn: delete user scene
    document.querySelectorAll('.delete-user-scene-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!confirm(`「${btn.closest('.scene-card')?.querySelector('span:nth-child(2)')?.textContent}」を削除しますか？`)) return;
            const { domain, sceneId } = btn.dataset;
            if (state.userScenes[domain]) {
                state.userScenes[domain] = state.userScenes[domain].filter(s => s.id !== sceneId);
                localStorage.setItem('userScenes', JSON.stringify(state.userScenes));
            }
            render();
        });
    });

    // Scene view: back
    document.getElementById('backToLearnBtn')?.addEventListener('click', () => {
        state.view = 'main'; state.bottomTab = 'learn'; render();
    });

    // Scene view: level change
    document.querySelectorAll('.scene-view-level-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.selectedLevel = btn.dataset.level; render(); });
    });

    // Scene view: format toggle
    document.getElementById('toggleFormatBtn')?.addEventListener('click', () => {
        state.showFormatPanel = !state.showFormatPanel; render();
    });

    // Scene view: format chips
    document.querySelectorAll('.format-chip').forEach(btn => {
        btn.addEventListener('click', () => {
            state.selectedFormat = btn.dataset.value; render();
        });
    });

    // Scene view: generate
    document.getElementById('generateBtn')?.addEventListener('click', () => {
        const card = document.getElementById('sceneGenerateCard');
        doGenerate(card);
    });

    // Scene view: open episode
    document.getElementById('openEpisodeBtn')?.addEventListener('click', () => {
        const key = episodeKey(state.selectedScene.domainId, state.selectedScene.sceneId, state.selectedLevel);
        state.currentEpisode = state.episodes[key];
        state.view = 'episode'; render();
    });

    // Scene view: regenerate
    document.getElementById('regenerateBtn')?.addEventListener('click', () => {
        const card = document.getElementById('sceneEpisodeCard');
        doGenerate(card);
    });

    // Episode: back
    document.getElementById('backBtn')?.addEventListener('click', () => {
        speechSynthesis.cancel();
        state.isPlaying = false; state.isPaused = false;
        state.view = state.selectedScene ? 'scene' : 'main';
        render();
    });

    // Episode: translation toggle
    const tlBtn = document.getElementById('translationToggleBtn');
    if (tlBtn) {
        tlBtn.addEventListener('click', () => {
            state.showTranslations = !state.showTranslations;
            document.querySelectorAll('.translation-text').forEach(el => {
                el.style.display = state.showTranslations ? 'block' : 'none';
            });
            tlBtn.style.background = state.showTranslations ? 'var(--primary)' : '#f3f4f6';
            tlBtn.style.color      = state.showTranslations ? 'white' : '#374151';
        });
    }

    // Episode: speed
    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.ttsRate = parseFloat(btn.dataset.rate);
            localStorage.setItem('ttsRate', String(state.ttsRate));
            if (state.isPlaying) { speechSynthesis.cancel(); ttsSpeak(state.currentEpisode); }
            document.querySelectorAll('.speed-btn').forEach(b => {
                const active = parseFloat(b.dataset.rate) === state.ttsRate;
                b.style.background = active ? 'var(--primary)' : '#f3f4f6';
                b.style.color = active ? 'white' : '#374151';
            });
        });
    });

    // Episode: play/pause
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
        playBtn.addEventListener('click', () => {
            if (state.isPlaying) {
                speechSynthesis.pause();
                state.isPlaying = false; state.isPaused = true;
                playBtn.innerHTML = '▶';
                document.getElementById('playBtnLabel').textContent = '再生';
            } else if (state.isPaused) {
                speechSynthesis.resume();
                state.isPlaying = true; state.isPaused = false;
                playBtn.innerHTML = '⏸';
                document.getElementById('playBtnLabel').textContent = '一時停止';
            } else {
                ttsSpeak(state.currentEpisode);
                playBtn.innerHTML = '⏸';
                document.getElementById('playBtnLabel').textContent = '一時停止';
            }
        });
    }

    // Episode: stop
    document.getElementById('stopBtn')?.addEventListener('click', () => {
        clearTimeout(ttsPauseTimer); speechSynthesis.cancel();
        state.isPlaying = false; state.isPaused = false; ttsIndex = 0;
        updatePlayerUI(); updateProgressBar();
        document.querySelectorAll('.seg-card').forEach(el => el.classList.remove('playing'));
    });

    // Episode: rewind
    document.getElementById('rewindBtn')?.addEventListener('click', () => {
        clearTimeout(ttsPauseTimer); speechSynthesis.cancel();
        ttsIndex = 0;
        if (state.isPlaying) ttsSpeak(state.currentEpisode);
        updateProgressBar();
    });

    // Episode: save phrase
    document.querySelectorAll('.save-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const phrase      = decodeURIComponent(btn.dataset.phrase);
            const explanation = decodeURIComponent(btn.dataset.explanation);
            const episodeTitle = decodeURIComponent(btn.dataset.episode);
            const idx = state.savedPhrases.findIndex(s => s.phrase === phrase);
            if (idx !== -1) { state.savedPhrases.splice(idx, 1); btn.textContent = '☆'; }
            else { state.savedPhrases.unshift({ phrase, explanation, episodeTitle, savedAt: new Date().toISOString() }); btn.textContent = '⭐'; }
            localStorage.setItem('savedPhrases', JSON.stringify(state.savedPhrases));
        });
    });

    // Episode: phrase highlights
    document.querySelectorAll('.highlight-phrase').forEach(el => {
        el.addEventListener('click', e => {
            e.stopPropagation();
            const pid = `${el.dataset.seg}-${el.dataset.hi}`;
            document.querySelectorAll('.phrase-tooltip').forEach(t => t.remove());
            document.querySelectorAll('.highlight-phrase.active').forEach(h => h.classList.remove('active'));
            if (state.activePhrase === pid) { state.activePhrase = null; return; }
            state.activePhrase = pid;
            el.classList.add('active');
            const tooltip = document.createElement('div');
            tooltip.className = 'phrase-tooltip fade-in';
            tooltip.innerHTML = `<strong style="color:#fde68a;">${escapeHtml(decodeURIComponent(el.dataset.phrase))}</strong><br><span style="color:#e2e8f0;font-size:12px;">${escapeHtml(decodeURIComponent(el.dataset.explanation))}</span>`;
            el.closest('.seg-card')?.appendChild(tooltip);
        });
    });
    document.addEventListener('click', e => {
        if (!e.target.classList.contains('highlight-phrase')) {
            document.querySelectorAll('.phrase-tooltip').forEach(t => t.remove());
            document.querySelectorAll('.highlight-phrase.active').forEach(h => h.classList.remove('active'));
            state.activePhrase = null;
        }
    }, { passive: true });

    // Phrases: delete single
    document.querySelectorAll('.delete-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.savedPhrases.splice(parseInt(btn.dataset.index, 10), 1);
            localStorage.setItem('savedPhrases', JSON.stringify(state.savedPhrases));
            render();
        });
    });

    // Phrases: clear all
    document.getElementById('clearPhrasesBtn')?.addEventListener('click', () => {
        if (confirm('保存したフレーズをすべて削除しますか？')) {
            state.savedPhrases = []; localStorage.setItem('savedPhrases', '[]'); render();
        }
    });

    // Settings: API key
    document.getElementById('saveApiKeyBtn')?.addEventListener('click', () => {
        const k = document.getElementById('settingsApiKey')?.value.trim();
        if (k) { state.apiKey = k; localStorage.setItem('apiKey', k); alert('APIキーを保存しました'); }
    });

    // Settings: voices
    document.getElementById('saveVoicesBtn')?.addEventListener('click', () => {
        speechSynthesis.cancel();
        state.voiceNameA = document.getElementById('voiceSelectA')?.value || '';
        state.voiceNameB = document.getElementById('voiceSelectB')?.value || '';
        localStorage.setItem('voiceNameA', state.voiceNameA);
        localStorage.setItem('voiceNameB', state.voiceNameB);
        alert('音声設定を保存しました');
    });
    document.getElementById('previewBtnA')?.addEventListener('click', () => previewVoice('voiceSelectA', 'previewBtnA'));
    document.getElementById('previewBtnB')?.addEventListener('click', () => previewVoice('voiceSelectB', 'previewBtnB'));

    // Settings: speed
    document.querySelectorAll('.settings-speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.ttsRate = parseFloat(btn.dataset.rate);
            localStorage.setItem('ttsRate', String(state.ttsRate));
            document.querySelectorAll('.settings-speed-btn').forEach(b => {
                const active = parseFloat(b.dataset.rate) === state.ttsRate;
                b.style.background = active ? 'var(--primary)' : '#f3f4f6';
                b.style.color = active ? 'white' : '#374151';
            });
        });
    });

    // Settings: clear episodes
    document.getElementById('clearEpisodesBtn')?.addEventListener('click', () => {
        if (confirm('エピソードキャッシュと進捗記録を削除しますか？フレーズ帳は残ります。')) {
            state.episodes = {}; state.sceneProgress = {};
            localStorage.setItem('episodes', '{}');
            localStorage.setItem('sceneProgress', '{}');
            render();
        }
    });

    // Settings: clear all
    document.getElementById('clearAllDataBtn')?.addEventListener('click', () => {
        if (confirm('すべてのデータをリセットしますか？この操作は取り消せません。')) {
            localStorage.clear(); location.reload();
        }
    });
}

// ===== INIT =====
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = initDefaultVoices;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
initDefaultVoices();
render();
</script>
</body>
</html>
